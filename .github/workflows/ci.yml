name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install release-check dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick jq ripgrep qt6-declarative-dev-tools
      - name: Run static and workspace-state checks
        # qmlformat comes from qt6-declarative-dev-tools so every QML file is
        # parsed in CI, not only on an Omarchy machine.
        run: ./scripts/static-check.sh < /dev/null
